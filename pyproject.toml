[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fokarat"
version = "3.1.0"
description = "Framework de cybersécurité éducatif - Building the future, one tool at a time"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Lwano Amissi Blanchard (FOKAS)", email = "amissilwano5@gmail.com" }
]
requires-python = ">=3.8"
keywords = ["cybersecurity", "framework", "pentest", "education", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.1.0",
    "black>=23.10.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
    "bandit>=1.7.5",
]
web = ["fastapi>=0.104.0", "uvicorn>=0.24.0"]
ai = ["llama-cpp-python>=0.2.0"]
build = ["pyinstaller>=6.0.0"]
all = ["fastapi>=0.104.0", "uvicorn>=0.24.0", "pyinstaller>=6.0.0"]

[project.urls]
Homepage = "https://github.com/amissilwano5-beep/Fokarat"
Repository = "https://github.com/amissilwano5-beep/Fokarat"
Issues = "https://github.com/amissilwano5-beep/Fokarat/issues"
Documentation = "https://github.com/amissilwano5-beep/Fokarat/blob/main/DOCUMENTATION.md"
Changelog = "https://github.com/amissilwano5-beep/Fokarat/blob/main/CHANGELOG.md"

[project.scripts]
fokarat = "main:main"

[tool.setuptools]
packages = ["core", "modules", "ai", "web"]
py-modules = ["main", "gui"]

# ══════════════════════════════════════════════════
#  RUFF
# ══════════════════════════════════════════════════
[tool.ruff]
line-length = 100
target-version = "py38"
src = ["."]
exclude = [".git", ".venv", "venv", "__pycache__", "output", "tools", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ══════════════════════════════════════════════════
#  BLACK
# ══════════════════════════════════════════════════
[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
extend-exclude = '''
/(\.git|\.venv|venv|__pycache__|output|tools|build|dist)/
'''

# ══════════════════════════════════════════════════
#  MYPY
# ══════════════════════════════════════════════════
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = ["output", "tools", "build", "dist", ".venv", "venv"]

[[tool.mypy.overrides]]
module = ["customtkinter.*", "llama_cpp.*", "duckencoder.*"]
ignore_missing_imports = true

# ══════════════════════════════════════════════════
#  PYTEST - Options minimales (cov activée via Makefile)
# ══════════════════════════════════════════════════
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: tests lents",
    "network: tests nécessitant un accès réseau",
    "integration: tests d'intégration",
]

# ══════════════════════════════════════════════════
#  COVERAGE
# ══════════════════════════════════════════════════
[tool.coverage.run]
source = ["core", "modules", "ai"]
omit = ["*/tests/*", "*/test_*.py", "*/__init__.py", "*/output/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

# ══════════════════════════════════════════════════
#  BANDIT
# ══════════════════════════════════════════════════
[tool.bandit]
exclude_dirs = ["tests", "output", "tools", "build", "dist"]
skips = ["B101", "B601"]