[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fokarat"
version = "3.5.0"
description = "Framework de cybersécurité éducatif et modulaire"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Lwano Amissi Blanchard (FOKAS)", email = "amissilwano5@gmail.com" }
]
requires-python = ">=3.8"
keywords = ["cybersecurity", "framework", "pentest", "education", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
    "ruff>=0.1.14",
    "black>=24.1.1",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "bandit>=1.7.7",
    "types-PyYAML",
    "types-requests",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
]
build = ["pyinstaller>=6.3.0"]
all = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "pyinstaller>=6.3.0",
]

[project.urls]
Homepage = "https://github.com/amissilwano5-beep/Fokarat"
Repository = "https://github.com/amissilwano5-beep/Fokarat"
Issues = "https://github.com/amissilwano5-beep/Fokarat/issues"
Documentation = "https://github.com/amissilwano5-beep/Fokarat/blob/main/DOCUMENTATION.md"

[project.scripts]
fokarat = "main:main"

[tool.setuptools]
packages = ["core", "modules", "web"]
py-modules = ["main"]

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = [".git", ".venv", "venv", "__pycache__", "output", "tools", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
extend-exclude = '''/(\.git|\.venv|venv|__pycache__|output|tools|build|dist)/'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = ["output", "tools", "build", "dist", ".venv", "venv"]

[[tool.mypy.overrides]]
module = ["customtkinter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = ["-v", "--strict-markers", "--tb=short"]
markers = [
    "slow: tests lents",
    "network: tests réseau",
    "integration: tests d'intégration",
]

[tool.coverage.run]
source = ["core", "modules", "web"]
omit = ["*/tests/*", "*/test_*.py", "*/__init__.py", "*/output/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "output", "tools", "build", "dist"]
skips = ["B101", "B601"]